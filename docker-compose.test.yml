# Isolated local test stack for the editor-polish branch.
#
# Run under a separate compose project so it never touches the running
# `llmstxt-local` (production) stack or any other project on this host:
#
#   docker compose -p llmstxt-test -f docker-compose.test.yml up -d --build
#
# Ports are deliberately off the usual numbers (8010/5442/6389) to dodge the
# ~6 other stacks already running. The API serves the bundled SPA on the same
# origin, so open http://localhost:8010/openorg/generate to test.
#
# Tear down completely (drops the throwaway DB volume):
#   docker compose -p llmstxt-test -f docker-compose.test.yml down -v

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: llmstxt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: llmstxt-test-api
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-dev_password}@postgres/llmstxt
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHARITY_COMMISSION_API_KEY: ${CHARITY_COMMISSION_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      STRIPE_MONITORING_PRICE_ID: ${STRIPE_MONITORING_PRICE_ID:-price_dummy}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dummy}
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      BASE_URL: http://localhost:8010
      FRONTEND_URL: http://localhost:8010
      CORS_ORIGINS: http://localhost:8010
      WEB_DIST_DIR: /app/web/dist
      FREE_TIER_DAILY_LIMIT: 1000
    ports:
      - "8010:8000"
    # Mount the branch source so the API reflects this working tree (editable
    # installs in the image point here). The bundled SPA at /app/web/dist is
    # left untouched by these mounts.
    volumes:
      - ./packages/core:/app/core
      - ./packages/api:/app/api
    command: uvicorn llmstxt_api.main:app --host 0.0.0.0 --port 8000 --reload --forwarded-allow-ips=127.0.0.1

  celery_worker:
    image: llmstxt-test-api
    depends_on:
      - postgres
      - redis
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-dev_password}@postgres/llmstxt
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHARITY_COMMISSION_API_KEY: ${CHARITY_COMMISSION_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      STRIPE_MONITORING_PRICE_ID: ${STRIPE_MONITORING_PRICE_ID:-price_dummy}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dummy}
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      BASE_URL: http://localhost:8010
      FRONTEND_URL: http://localhost:8010
    volumes:
      - ./packages/core:/app/core
      - ./packages/api:/app/api
    command: celery -A llmstxt_api.tasks.celery worker -l info

volumes:
  test_postgres_data:
